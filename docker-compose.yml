services:
  postgres:
    image: postgres:17
    container_name: olist-postgres
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist
    ports:
      - "5433:5432"
    volumes:
      - ./data:/data
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: